[workspace]
resolver = "2"
members = [
    "crates/tf-core",
    "crates/tf-vision",
    "crates/tf-inference",
    "crates/tf-state",
    "crates/tf-rec",
    "crates/tf-table",
    "crates/tf-napi",
    "crates/tf-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TableFlow Team"]
license = "Proprietary"
publish = false

[workspace.dependencies]
# Local crates
tf-core = { path = "crates/tf-core" }
tf-vision = { path = "crates/tf-vision" }
tf-inference = { path = "crates/tf-inference" }
tf-state = { path = "crates/tf-state" }
tf-rec = { path = "crates/tf-rec" }
tf-table = { path = "crates/tf-table" }

# Async / runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Concurrency primitives
crossbeam = "0.8"
flume = "0.11"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"

# Misc
num_cpus = "1"
crc32fast = "1"
bytemuck = "1"

# Dev dependencies
proptest = "1"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.lints.rust]
dead_code = { level = "allow", priority = -1 }
