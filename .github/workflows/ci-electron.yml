name: Electron CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn workspace @table-flow/desktop typecheck

      - name: Build
        run: yarn workspace @table-flow/desktop build

      - name: Integration tests
        run: yarn workspace @table-flow/desktop test:integration
