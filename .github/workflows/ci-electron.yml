# TODO(detail-impl): typecheck / lint / e2e
name: CI · Electron

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-electron.yml"
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
